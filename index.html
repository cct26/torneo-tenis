<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torneo</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1b1f66"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Torneo CCT">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
/* VOICE: the club's own tournament poster, loud and festive, but the tables stay crisp
   IDEA: the XXXI Challenger poster — sunset court sky, blocky outlined title, torn colour ribbons
   PICTURE: poster header with the ball and tilted date ribbon, then the live order of play
   COLOUR/TYPE: poster navy-violet, court green, ball lime, magenta, teal; Bungee + Montserrat italic
   LAYOUT: poster header, sticky navy ribbon of tabs, one column list, group sheets in a grid */
:root{color-scheme:light dark;--bg:light-dark(#eaf2fb,#0d1240);--card:light-dark(#fff,#171d57);--ink:light-dark(#191c5c,#eef0ff);--mut:light-dark(#5a6290,#a9b0e0);--line:light-dark(#d6def0,#2b3378);
--navy:#252a86;--navyd:#1b1f66;--green:#22643a;--lime:#d9f03b;--mag:#e2157b;--teal:#2cc4bd;--win:light-dark(#11743a,#7ee6a5);--warn:light-dark(#b4500c,#ffb26b);--hd:Bungee,"Arial Black",Impact,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Montserrat,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{margin:0;line-height:1.05}
button,input,select{font:inherit;color:inherit}
.it{font-style:italic;font-weight:800}
header{position:relative;overflow:hidden;color:#fff;padding:26px max(4vw,16px) 22px;
 background:radial-gradient(120% 80% at 0% 100%,#ffc36a 0,#f39a4a 18%,transparent 52%),linear-gradient(175deg,#1f5fb4 0%,#3c8fda 45%,#7cc0ee 78%,#bfe3f7 100%)}
header::before{content:"";position:absolute;inset:auto -5% -40px -5%;height:90px;background:linear-gradient(180deg,#2a63b6,#1e3f8f);transform:skewY(-3deg);opacity:.9}
.hw{position:relative;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:center}
.ttl{position:relative;transform:rotate(-3deg);transform-origin:left center;padding-top:6px}
.xxxi{font-family:var(--hd);font-size:clamp(34px,7vw,58px);color:var(--green);letter-spacing:-.02em;line-height:.9;
 text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 2px 0 #fff,2px 0 0 #fff,5px 6px 0 #0b2a5a55}
h1{font-family:var(--hd);font-weight:400;text-transform:uppercase;font-size:clamp(28px,7vw,64px);line-height:.92;color:var(--navy);
 text-shadow:3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,0 3px 0 #fff,3px 0 0 #fff,0 -3px 0 #fff,-3px 0 0 #fff,6px 7px 0 var(--mag)}
h1 .dt{display:inline-block;font-size:.5em;color:var(--green);vertical-align:.55em;margin-left:.2em}
.fecha{display:inline-block;margin-top:14px;background:var(--green);color:#fff;font:italic 900 clamp(18px,3.4vw,26px)/1 Montserrat,sans-serif;padding:8px 16px;transform:skewX(-10deg);box-shadow:4px 4px 0 #0b2a5a55}
.ball{width:clamp(84px,16vw,150px);aspect-ratio:1;filter:drop-shadow(6px 10px 10px #0b2a5a66);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(8deg)}}
.club{position:relative;max-width:1240px;margin:14px auto 0;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.club .cc{font:italic 700 15px Montserrat;text-shadow:0 1px 3px #0b2a5a88}
.prog{flex:1;min-width:230px;max-width:380px;background:var(--lime);color:var(--navyd);padding:8px 14px 10px;transform:skewX(-8deg);box-shadow:4px 4px 0 #0b2a5a44}
.prog>*{transform:skewX(8deg)}
.prog .n{font:italic 800 15px Montserrat}
.meter{height:8px;background:#25298633;margin-top:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--navy);transition:width .4s}
.bar{position:sticky;top:0;z-index:5;background:var(--navyd);padding:10px max(4vw,16px);box-shadow:0 8px 16px -10px #000a}
.bw{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:100%}
.tab{flex:none;border:0;padding:10px 12px;min-height:44px;background:#ffffff1c;color:#fff;font:italic 800 15px Montserrat;cursor:pointer;transform:skewX(-10deg)}
@media(max-width:600px){.tab{font-size:13px;padding:10px 8px}.sub .seg{width:100%}.sub .seg button{flex:1;padding:8px 6px;font-size:14px}}
.tab span{display:inline-block;transform:skewX(10deg)}
.tab[aria-current=true]{background:var(--lime);color:var(--navyd)}
.srch{flex:1;min-width:180px;display:flex;align-items:center;gap:6px;background:#fff;color:var(--navyd);border-radius:999px;padding:0 6px 0 16px;min-height:44px}
.srch input{border:0;outline:0;background:none;flex:1;font-size:16px;min-height:42px;color:var(--navyd)}
.srch button{border:0;background:none;padding:8px;cursor:pointer;color:#5a6290}
main{max-width:1240px;margin:0 auto;padding:20px max(4vw,16px) 60px}
.st{color:var(--warn);font-weight:600;margin:0 0 10px}.st:empty{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:14px}
.chip{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;min-height:44px;font-weight:700;cursor:pointer}
.chip[aria-current=true]{background:var(--mag);border-color:var(--mag);color:#fff}
.chip small{font-weight:500;opacity:.8;margin-left:4px}
.slot{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 14px;padding:14px 0;border-top:2px dashed var(--line)}
.slot:first-of-type{border-top:0}
.hr{font:italic 900 30px/1 Montserrat,sans-serif;color:var(--navy);white-space:nowrap;padding-top:8px}
:root[data-theme=dark] .hr{color:var(--lime)}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .hr{color:var(--lime)}}
.hr small{display:block;font:600 14px Montserrat;color:var(--mut);margin-top:5px}
.list{display:grid;gap:8px}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-left:6px solid var(--teal);border-radius:10px;padding:10px 14px;min-height:56px}
.m.k0{border-left-color:var(--navy)}.m.k1{border-left-color:var(--mag)}.m.k2{border-left-color:var(--green)}.m.k3{border-left-color:var(--teal)}.m.k4{border-left-color:#f39a4a}
button.m{cursor:pointer}button.m:hover{border-color:var(--navy)}
.tag{grid-column:1/-1;font-size:13px;color:var(--mut);font-weight:700}
.pl{display:flex;flex-direction:column;line-height:1.3;font-weight:500}
.pl span.w{font-weight:800;color:var(--win)}
.sc{font:italic 800 18px Montserrat;white-space:nowrap;text-align:right}
.sc small{display:block;font:500 12px Montserrat;color:var(--mut);font-style:normal}
.sc.pend{font-size:14px;color:var(--mag)}.sc.no{font-size:14px;color:var(--mut);font-weight:600}
mark{background:var(--lime);color:var(--navyd);border-radius:3px;padding:0 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr));gap:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.rib{margin:0 -14px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:var(--navy);color:#fff}
.rib h3{font:italic 900 22px Montserrat;text-transform:uppercase}
.rib small{font-weight:700;font-size:13px;background:#ffffff22;padding:3px 9px;border-radius:99px}
.rib small.ok{background:var(--lime);color:var(--navyd)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--navyd);background:var(--lime);font-weight:800;text-align:right;padding:6px 5px;white-space:nowrap}
td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;min-width:118px}
td.pos{font:italic 900 19px Montserrat;color:var(--mag)}
tr.q td:nth-child(2){font-weight:700}tr.q td.pos::after{content:"●";font-size:10px;color:var(--win);margin-left:3px;vertical-align:middle}
.note{color:var(--mut);font-size:14px;margin:6px 0 14px;max-width:72ch}
.qual{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.qual span{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.qual b{color:var(--mag);margin-right:4px}
.br{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.rd{flex:none;width:min(250px,78vw);display:flex;flex-direction:column;gap:10px;scroll-snap-align:start}.rdm{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:space-around}
.rd h3{font:italic 900 18px Montserrat;color:var(--mag);text-transform:uppercase}
.km{background:var(--card);border:2px solid var(--line);border-radius:10px;overflow:hidden;width:100%;text-align:left;padding:0}
button.km{cursor:pointer}button.km:hover{border-color:var(--navy)}
.km div{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;min-height:40px;align-items:center}
.km div+div{border-top:1px solid var(--line)}
.km .w{font-weight:800;color:var(--win)}.km .tbd{color:var(--mut);font-style:italic}
.km .s{font:italic 800 16px Montserrat;white-space:nowrap}
.pts{margin-top:18px;display:grid;gap:6px;max-width:520px}
.pts h3{font:italic 900 20px Montserrat;color:var(--navy);text-transform:uppercase}
:root[data-theme=dark] .pts h3{color:var(--lime)}
.pts div{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:8px 12px}
.pts b{font:italic 800 16px Montserrat;color:var(--mag);white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.btn{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;min-height:44px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--mag);border-color:var(--mag);color:#fff}
.tools select,.seeds select{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px;min-height:44px;font-size:16px}
.seeds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:8px;margin-bottom:16px}
.seeds label{display:flex;gap:8px;align-items:center;font-weight:700}.seeds select{flex:1}
.empty{color:var(--mut);padding:30px 0}
/* convocatoria */
.conv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:24px;align-items:start}
.poster{width:100%;border-radius:14px;box-shadow:0 12px 30px #0b2a5a44;display:block}
.side{position:sticky;top:84px;display:grid;gap:12px}
.ins{background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px}
.ins b{color:var(--lime)}.ins a{color:#fff}
.sec{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0 18px 16px;margin-bottom:16px;overflow:hidden}
.sec h2{margin:0 -18px 12px;padding:10px 18px;font:italic 900 19px Montserrat;text-transform:uppercase;color:#fff;background:var(--mag)}
.sec:nth-child(3n+2) h2{background:var(--navy)}.sec:nth-child(3n) h2{background:var(--lime);color:var(--navyd)}
.sec p,.sec li{margin:0 0 8px;max-width:70ch}.sec ul{padding-left:20px;margin:0}
.sec strong{color:var(--mag)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.big div{background:var(--bg);border-radius:10px;padding:10px 12px}
.big b{display:block;font:italic 900 22px Montserrat;color:var(--navy)}:root[data-theme=dark] .big b{color:var(--lime)}
.big span{font-size:14px;color:var(--mut)}
dialog{border:0;border-radius:16px;padding:0;width:min(440px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 50px #0008;overflow:hidden}
dialog::backdrop{background:#0d1240aa}
.dl{padding:0 20px 20px;display:grid;gap:14px}
.dh{margin:0 -20px;padding:14px 20px;background:var(--navy);color:#fff}
.dh .tag{color:#ffffffbb}.dh h2{font:italic 900 22px Montserrat;margin-top:4px}
.dl label{font-weight:700}
.fld,.dl input[type=text]{width:100%;font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);min-height:48px;margin-top:4px}
.sb{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,60px);gap:8px;align-items:center}
.sb.notb{grid-template-columns:minmax(0,1fr) repeat(2,60px)}.sb.notb .tb{display:none}
.sh{font-size:12px;font-weight:800;color:var(--mut);text-align:center;text-transform:uppercase}
.sn{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.bx{width:100%;height:58px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;font:italic 900 28px Montserrat,sans-serif;padding:0}
.bx.tb{border-style:dashed}
.bx.won{border-color:var(--win);color:var(--win);background:light-dark(#e9f8ef,#123a2a)}
[hidden]{display:none!important}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:600!important;font-size:14px}.ck input{width:22px;height:22px;flex:none;margin-top:1px}
input:focus-visible,.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.m:focus-visible,.km:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.prev{font-weight:700;min-height:24px}.prev.bad{color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px}.row .btn{flex:1}
.hint{font-size:13px;color:var(--mut)}
.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.virt{background:light-dark(#fde7d6,#4a2a12);border-radius:12px;padding:12px;display:grid;gap:8px;font-size:14px}.virt p{margin:0}
@media(max-width:860px){.conv{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}.poster{max-width:460px}}
@media(max-width:600px){.slot{grid-template-columns:66px minmax(0,1fr);gap:4px 10px}.hr{font-size:22px}table{font-size:13px}th,td{padding:6px 3px}.hw{grid-template-columns:minmax(0,1fr) 74px}}
@media(prefers-reduced-motion:reduce){.ball{animation:none}.meter i{transition:none}}

.sub{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 16px}
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto;max-width:100%}
.seg button{flex:none;border:0;background:none;border-radius:9px;padding:8px 14px;min-height:40px;font-weight:700;cursor:pointer;color:var(--ink)}
.seg button[aria-current=true]{background:var(--navy);color:#fff}
.seg.rama button[aria-current=true]{background:var(--mag)}
.seg button small{font-weight:500;opacity:.75;margin-left:4px}
.badge{display:inline-block;font:700 12px Montserrat;padding:2px 8px;border-radius:99px;background:light-dark(#fde7d6,#4a2a12);color:var(--warn);margin-top:3px;justify-self:start}
.badge.rep{background:light-dark(#e3ecff,#1f2c6b);color:var(--navy)}:root[data-theme=dark] .badge.rep{color:#b9c8ff}
.where{font-size:13px;color:var(--mut)}
.fld{font-size:16px!important;min-height:44px!important}
.dl label{display:grid;gap:4px}
.dl .ck{display:flex}
.mv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end;background:var(--bg);border-radius:12px;padding:10px}
.mv .btn{grid-column:1/-1}
.when{font-weight:700}
.sep{border:0;border-top:2px dashed var(--line);margin:2px 0}
dialog{max-height:92vh;overflow:auto}
.plist{display:grid;gap:6px}
.pi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:9px 14px;text-align:left;width:100%;min-height:50px}
button.pi{cursor:pointer}button.pi:hover{border-color:var(--navy)}
.pi small{color:var(--mut)}
.cath{font:italic 900 20px Montserrat;text-transform:uppercase;color:var(--navy);margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
:root[data-theme=dark] .cath{color:var(--lime)}
.edrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center}
.edrow select{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;min-height:44px;font-size:16px;width:100%}
.mini{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;min-height:44px;font-weight:700;cursor:pointer}
.mini.danger{color:var(--warn)}
.rib .mini{background:#ffffff22;border-color:transparent;color:#fff;min-height:36px}
.org{display:grid;gap:18px;max-width:860px}
.box{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0 18px 18px;overflow:hidden}
.box>h2{margin:0 -18px 14px;padding:10px 18px;font:italic 900 19px Montserrat;text-transform:uppercase;color:#fff;background:var(--navy)}
.box:nth-child(2n)>h2{background:var(--mag)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.form label{display:grid;gap:4px;font-weight:700;font-size:14px}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{width:100%;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:9px 12px;font:16px Montserrat,system-ui,sans-serif;min-height:44px}
.form textarea{min-height:260px;font-size:14px;line-height:1.5}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ok-msg{color:var(--win);font-weight:700}
.imp table{font-size:13px}.imp td,.imp th{text-align:left}
.imp ul{margin:6px 0;padding-left:20px;color:var(--warn);font-size:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;background:var(--bg)}
.drop input{font-size:15px}
.fmt{font-size:14px}.fmt code{background:var(--bg);padding:1px 6px;border-radius:5px}
.login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:linear-gradient(175deg,#1f5fb4 0%,#3c8fda 55%,#f39a4a 100%)}
.login form{width:min(380px,100%);background:var(--card);color:var(--ink);border-radius:16px;padding:0 20px 20px;display:grid;gap:12px;box-shadow:0 20px 50px #0006;overflow:hidden}
.login h2{margin:0 -20px 4px;padding:14px 20px;background:var(--navy);color:#fff;font:italic 900 22px Montserrat}
.login label{display:grid;gap:4px;font-weight:700}
.login a{color:var(--mut);font-size:14px;text-align:center}
#tabSalir{background:#ffffff10}
#lm:empty{display:none}
</style></head><body>
<header>
 <div class="hw">
  <div class="ttl"><div class="xxxi" id="hEd"></div><h1><span id="hNom">Torneo</span><span class="dt" id="hSub"></span></h1><div class="fecha" id="hFe" hidden></div></div>
  <svg class="ball" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="bgb" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#f4ff7a"/><stop offset=".6" stop-color="#d6ee2f"/><stop offset="1" stop-color="#9fb81a"/></radialGradient></defs>
   <circle cx="50" cy="50" r="47" fill="url(#bgb)"/><path d="M14 22c18 10 22 46 4 62M86 18c-18 12-22 48-2 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/></svg>
 </div>
 <div class="club"><span class="cc" id="hSede"></span>
  <div class="prog"><div><div class="n" id="pn">Cargando…</div><div class="meter"><i id="pm" style="width:0"></i></div></div></div></div>
</header>
<div class="bar"><div class="bw">
 <nav class="tabs" id="tabs">
  <button class="tab" data-v="S"><span>Singles</span></button>
